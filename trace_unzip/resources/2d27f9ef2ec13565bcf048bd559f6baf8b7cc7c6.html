        /* ──────────────────────────────────────────────────
           LOGIN PAGE — Zefirus brand design system
           Tokens: var(--background), var(--surface), var(--border),
                   var(--c-brand), var(--cyan), var(--cyan-dim),
                   var(--foreground), var(--text-secondary), var(--text-muted)
           Fonts:  Inter (body), Orbitron (logo via ZefirusLogo)
        ────────────────────────────────────────────────── */

        .login-page-root {
          position: relative;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          padding: 24px;
          /* Zefirus native dark background */
          background-color: var(--background);
          font-family: var(--font-sans, 'Inter', system-ui, sans-serif);
        }

        /* ── Background radial glow (identical to .dashboard-bg) ── */
        .login-bg-glow {
          position: absolute;
          inset: 0;
          z-index: 0;
          pointer-events: none;
          background:
            radial-gradient(ellipse 700px 500px at 15% 25%, var(--cyan-dim) 0%, transparent 70%),
            radial-gradient(ellipse 500px 600px at 85% 75%, rgba(100,0,180,0.05) 0%, transparent 70%);
        }

        /* ── Grid overlay (same as .dashboard-grid) ── */
        .login-bg-grid {
          position: absolute;
          inset: 0;
          z-index: 0;
          pointer-events: none;
          background-image:
            linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
          background-size: 80px 80px;
          mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 90%);
        }

        /* ── Corner scan line decorators ── */
        .login-corner {
          position: absolute;
          z-index: 1;
          pointer-events: none;
        }
        .login-corner-tl {
          top: 20px; left: 20px;
        }
        .login-corner-br {
          bottom: 20px; right: 20px;
          transform: rotate(180deg);
        }
        .login-corner svg line {
          stroke: var(--c-brand);
          stroke-width: 1;
          opacity: 0.4;
        }

        /* ── Horizontal scan line animation ── */
        @keyframes login-scan {
          0%   { top: -2px; opacity: 0; }
          10%  { opacity: 0.6; }
          90%  { opacity: 0.4; }
          100% { top: 100%; opacity: 0; }
        }
        .login-scan-line {
          position: absolute;
          left: 0; right: 0;
          height: 1px;
          background: linear-gradient(90deg, transparent 0%, var(--cyan) 40%, var(--cyan) 60%, transparent 100%);
          animation: login-scan 6s linear infinite;
          pointer-events: none;
          z-index: 2;
          opacity: 0;
        }

        /* ── Main card — uses Zefirus glass-panel pattern ── */
        .login-card {
          position: relative;
          z-index: 10;
          width: 100%;
          max-width: 400px;
          /* glass-panel base */
          background: var(--surface);
           saturate(1.4);
          -webkit- saturate(1.4);
          border: 1px solid var(--border);
          border-radius: 16px;
          overflow: hidden;
          box-shadow:
            0 30px 80px rgba(0,0,0,0.6),
            0 0 0 1px rgba(59,130,246,0.06) inset;
        }

        /* Top cyan accent line — same as .glass-panel::before */
        .login-card::before {
          content: '';
          position: absolute;
          top: 0; left: 0; right: 0;
          height: 1px;
          background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
          z-index: 1;
        }

        /* Subtle inner glow top-left */
        .login-card::after {
          content: '';
          position: absolute;
          top: 0; left: 0;
          width: 150px; height: 150px;
          background: linear-gradient(135deg, var(--cyan-dim), transparent);
          pointer-events: none;
        }

        .login-card-inner {
          position: relative;
          z-index: 2;
          padding: 40px 36px 36px;
        }

        /* ── System label — .t-label style ── */
        .login-system-label {
          font-family: var(--font-display);
          font-size: 9px;
          font-weight: 700;
          letter-spacing: 0.25em;
          text-transform: uppercase;
          color: var(--cyan);
          opacity: 0.7;
          text-align: center;
          margin-bottom: 20px;
        }

        /* ── Inputs — matches globals .f-input ── */
        .login-input {
          width: 100%;
          padding: 10px 12px;
          font-family: var(--font-sans, 'Inter', system-ui, sans-serif);
          font-size: 13px;
          color: var(--foreground);
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 8px;
          outline: none;
          transition: border-color 0.15s, box-shadow 0.15s;
          box-sizing: border-box;
          margin-bottom: 10px;
        }
        .login-input::placeholder { color: var(--text-muted); }
        .login-input:focus {
          border-color: var(--c-brand);
          box-shadow: 0 0 0 3px var(--cyan-dim);
        }
        .login-input-wrap {
          position: relative;
          margin-bottom: 10px;
        }
        .login-input-wrap .login-input {
          margin-bottom: 0;
          padding-right: 40px;
        }

        /* ── Eye toggle ── */
        .login-eye-btn {
          position: absolute;
          right: 10px; top: 50%;
          transform: translateY(-50%);
          background: none; border: none;
          cursor: pointer;
          color: var(--text-muted);
          display: flex; align-items: center;
          padding: 4px;
          transition: color 0.15s;
        }
        .login-eye-btn:hover { color: var(--text-secondary); }

        /* ── Divider ── */
        .login-divider {
          display: flex;
          align-items: center;
          gap: 12px;
          margin: 20px 0;
        }
        .login-divider-line {
          flex: 1;
          height: 1px;
          background: var(--border);
        }
        .login-divider-text {
          font-size: 11px;
          color: var(--text-muted);
          letter-spacing: 0.05em;
          white-space: nowrap;
        }

        /* ── Tab switch ── */
        .login-tabs {
          display: flex;
          gap: 4px;
          margin-bottom: 20px;
          padding: 3px;
          background: rgba(0,0,0,0.3);
          border: 1px solid var(--border);
          border-radius: 8px;
        }
        .login-tab {
          flex: 1;
          padding: 8px 10px;
          font-family: var(--font-display);
          font-size: 9px;
          font-weight: 700;
          letter-spacing: 0.15em;
          text-transform: uppercase;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          transition: all 0.2s;
          color: var(--text-muted);
          background: transparent;
        }
        .login-tab.active {
          background: var(--cyan-dim);
          color: var(--cyan);
          border: 1px solid var(--border-strong);
          box-shadow: 0 0 12px var(--cyan-dim);
        }

        /* ── CTA — matches .btn-brand ── */
        .login-btn-primary {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          width: 100%;
          padding: 11px 22px;
          border-radius: 8px;
          border: none;
          background: linear-gradient(135deg, var(--cyan) 0%, #2563eb 100%);
          color: #fff;
          font-family: var(--font-display);
          font-size: 10px;
          font-weight: 700;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          cursor: pointer;
          transition: all 0.25s ease;
          box-shadow: 0 4px 18px rgba(59,130,246,0.35);
          margin-top: 8px;
        }
        .login-btn-primary:hover:not(:disabled) {
          transform: translateY(-1px);
          box-shadow: 0 6px 24px rgba(59,130,246,0.5);
        }
        .login-btn-primary:disabled {
          opacity: 0.4;
          cursor: not-allowed;
          transform: none;
        }

        /* ── Ghost / OAuth buttons — .btn-ghost ── */
        .login-btn-ghost {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          padding: 10px 14px;
          border-radius: 8px;
          border: 1px solid var(--border);
          background: var(--surface);
          color: var(--foreground);
          font-family: var(--font-sans, 'Inter', system-ui, sans-serif);
          font-size: 12px;
          font-weight: 500;
          cursor: pointer;
          transition: all 0.2s ease;
        }
        .login-btn-ghost:hover:not(:disabled) {
          border-color: var(--border-strong);
          background: rgba(255,255,255,0.04);
        }
        .login-btn-ghost:disabled { opacity: 0.35; cursor: not-allowed; }

        /* ── Error row ── */
        .login-error {
          display: flex;
          align-items: flex-start;
          gap: 8px;
          padding: 9px 12px;
          border-radius: 6px;
          background: rgba(229,72,77,0.08);
          border: 1px solid rgba(229,72,77,0.2);
          color: var(--c-danger, #e5484d);
          font-size: 12px;
          margin-bottom: 12px;
          line-height: 1.4;
        }

        /* ── Spinner ── */
        @keyframes login-spin { to { transform: rotate(360deg); } }
        .login-spinner {
          width: 16px; height: 16px;
          border: 2px solid rgba(255,255,255,0.25);
          border-top-color: #fff;
          border-radius: 50%;
          animation: login-spin 0.7s linear infinite;
          display: inline-block;
        }

        /* ── Success ── */
        @keyframes login-check-scale {
          from { transform: scale(0.6); opacity: 0; }
          to   { transform: scale(1); opacity: 1; }
        }
        .login-success-icon {
          animation: login-check-scale 0.4s cubic-bezier(0.34,1.56,0.64,1);
          width: 60px; height: 60px;
          margin: 0 auto 20px;
          background: var(--cyan-dim);
          border: 1px solid var(--border-strong);
          border-radius: 8px;
          display: flex; align-items: center; justify-content: center;
          box-shadow: 0 0 20px var(--cyan-dim);
        }

        /* ── Avatar (returning user) ── */
        .login-avatar {
          width: 52px; height: 52px;
          margin: 0 auto 14px;
          background: linear-gradient(135deg, var(--red), #d98843);
          border: 1px solid rgba(229,72,77,0.35);
          display: flex; align-items: center; justify-content: center;
          font-family: var(--font-display);
          font-size: 18px;
          font-weight: 700;
          color: #fff;
          position: relative;
        }
        .login-avatar::after {
          content: '';
          position: absolute;
          inset: -3px;
          border: 1px solid rgba(229,72,77,0.2);
        }

        /* ── Lang toggle ── */
        .login-lang-toggle {
          position: absolute;
          top: 16px; right: 16px;
          z-index: 30;
          display: flex;
          gap: 2px;
          padding: 3px;
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 100px;
          
        }
        .login-lang-btn {
          padding: 5px 12px;
          border: none;
          border-radius: 100px;
          cursor: pointer;
          font-family: var(--font-display);
          font-size: 9px;
          font-weight: 700;
          letter-spacing: 0.1em;
          transition: all 0.2s;
          background: transparent;
          color: var(--text-muted);
        }
        .login-lang-btn.active {
          background: var(--cyan-dim);
          color: var(--cyan);
        }

        /* ── Forgot link ── */
        .login-forgot {
          font-size: 11px;
          color: var(--cyan);
          text-decoration: none;
          opacity: 0.75;
          transition: opacity 0.15s;
          display: block;
          text-align: right;
          margin: 4px 0 18px;
          font-family: var(--font-sans, 'Inter', system-ui, sans-serif);
        }
        .login-forgot:hover { opacity: 1; }

        /* ── Use other account link ── */
        .login-other-link {
          display: block;
          text-align: center;
          margin-top: 18px;
          font-size: 11px;
          color: var(--text-muted);
          text-decoration: none;
          transition: color 0.15s;
          cursor: pointer;
          background: none; border: none;
          font-family: var(--font-sans, 'Inter', system-ui, sans-serif);
        }
        .login-other-link:hover { color: var(--text-secondary); }

        /* ── Secure label ── */
        .login-secure {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 5px;
          margin-top: 18px;
          font-size: 10px;
          color: var(--text-muted);
          letter-spacing: 0.03em;
          font-family: var(--font-sans, 'Inter', system-ui, sans-serif);
        }

        /* ── HUD corner decorators ── */
        @keyframes login-corner-blink {
          0%, 80%, 100% { opacity: 0.3; }
          90% { opacity: 1; }
        }
        .login-hud-corner { animation: login-corner-blink 4s ease-in-out infinite; }
        .login-hud-corner-delay { animation: login-corner-blink 4s ease-in-out infinite 2s; }

        /* ── Responsive ── */
        @media (max-width: 480px) {
          .login-card-inner { padding: 28px 20px 24px; }
        }
        @media (prefers-reduced-motion: reduce) {
          * { animation: none !important; transition: none !important; }
        }
