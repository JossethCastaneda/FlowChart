name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22+ — some deps (@prisma/streams-local, mixpart) require node >=22.
          node-version: 22
          cache: npm

      # `npm install` (not `npm ci`): the lockfile is written by npm 11 and is
      # not strictly portable to the npm 10.x that ships with older Node. install
      # reconciles it instead of failing. postinstall runs `prisma generate`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # Lint is advisory for now — the codebase has a large backlog of
      # pre-existing @typescript-eslint/no-explicit-any errors. Surfaced
      # here without failing the build; tighten once the backlog is cleared.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
