name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # Lint is advisory for now — the codebase has a large backlog of
      # pre-existing @typescript-eslint/no-explicit-any errors. Surfaced
      # here without failing the build; tighten once the backlog is cleared.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
