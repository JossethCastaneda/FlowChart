name: Publish Docker image to Vercel Container Registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with Vercel Container Registry
        id: get-oidc-token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('vercel.com');
            core.setOutput('token', token);

      - name: Docker login to Vercel Container Registry
        run: echo "${{ steps.get-oidc-token.outputs.token }}" | docker login vcr.vercel.com --username oidc --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: vcr.vercel.com/josseths-projects-b50cae29/flowchart/flowchart-repositorio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
